"$schema" = 'https://starship.rs/config-schema.json'

format = """\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$docker_context\
$package\
$elixir\
$nodejs\
$python\
$ruby\
$gcloud\
$env_var\
$mise\
$cmd_duration\
$line_break\
$jobs\
$battery\
$status\
$container\
$character"""

command_timeout = 500
add_newline = true

# Show execution time for long-running commands
[cmd_duration]
min_time = 5_000  # Show timing for commands > 5 seconds
format = "took [$duration]($style) "
style = "bold yellow"
show_milliseconds = true

