"$schema" = 'https://starship.rs/config-schema.json'

# Whitelist philosophy: `format` names every module that may render — anything
# not listed is never even evaluated (faster, and new Starship modules can't
# sneak into the prompt). To add a module, add it to the format string.
#
# username/hostname only render over SSH or as root; jobs/battery/status only
# when relevant. Day to day this renders: directory, git, cmd_duration, ❯.
format = """\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$docker_context\
$package\
$python\
$ruby\
$cmd_duration\
$line_break\
$jobs\
$battery\
$status\
$character"""

command_timeout = 500
add_newline = true

# Show execution time for long-running commands
[cmd_duration]
min_time = 5_000  # Show timing for commands > 5 seconds
format = "took [$duration]($style) "
style = "bold yellow"
show_milliseconds = true
