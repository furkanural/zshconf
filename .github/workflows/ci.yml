name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.tools }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tools: [bare, full]   # bare exercises every $+commands degradation guard
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: Set up Homebrew (full)
        if: matrix.tools == 'full'
        uses: Homebrew/actions/setup-homebrew@c8707045ccae42888fe98e86f2ee8938bc7cc193 # 2026.08.10.1

      - name: Install optional tools (full)
        if: matrix.tools == 'full'
        run: brew bundle

      - name: Cache zinit + plugins
        uses: actions/cache@v6
        with:
          path: ~/.local/share/zinit
          key: zinit-${{ runner.os }}-${{ matrix.tools }}-${{ hashFiles('modules/plugins.zsh') }}

      - name: Run tests
        run: zsh tests/run.zsh

  bench:
    name: startup benchmark (report only, never gates)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    env:
      # Ubuntu's /etc/zsh/zshrc runs a bare compinit; on runners with
      # group-writable fpath dirs it prompts (or aborts) and zsh-bench
      # hangs on the prompt. The config owns completion setup — skip it.
      skip_global_compinit: 1
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Install config into runner HOME
        run: ./install.sh
      - name: Warm up (clone zinit + plugins, build compdump)
        run: |
          { for i in $(seq 1 50); do echo 'sleep 0.3'; done; echo exit; } | zsh -i >/dev/null 2>&1 || true
      - name: Startup benchmark
        run: zsh .github/bench.zsh | tee -a "$GITHUB_STEP_SUMMARY"
